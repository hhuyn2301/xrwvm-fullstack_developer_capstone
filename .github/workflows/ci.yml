name: Capstone CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_COOKIES: "0"
      WRITE_API_TOKEN: ci-only-api-token
      CAPTURE_ADMIN_PASSWORD: ci-local-capture-only-7391!
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/frontend/package-lock.json
            server/database/package-lock.json
      - name: Install Python requirements
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install -r server/djangoapp/microservices/requirements.txt
      - name: Build React
        working-directory: server/frontend
        run: |
          npm ci
          npm run build
      - name: Test Express API validation
        working-directory: server/database
        run: |
          npm ci
          npm test
      - name: Check and test Django
        working-directory: server
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Test sentiment service
        working-directory: server/djangoapp/microservices
        run: python -m unittest -v test_app.py
      - name: Validate Compose and build all application images
        run: |
          docker compose config --quiet
          docker compose build
      - name: Install real browser capture dependencies
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xterm xvfb
      - name: Start real application services
        run: |
          docker compose up -d
          mkdir -p evidence
          cd server
          python manage.py migrate --noinput
          python manage.py seed_cars
          python manage.py runserver 127.0.0.1:8001 --noreload > ../evidence/django-server.log 2>&1 &
      - name: Create CI-only administrator
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          docker compose exec -T -e CAPTURE_ADMIN_PASSWORD web python manage.py shell -c "import os; from django.contrib.auth.models import User; u,_=User.objects.get_or_create(username='root'); u.is_staff=True; u.is_superuser=True; u.set_password(os.environ['CAPTURE_ADMIN_PASSWORD']); u.save()"
      - name: Exercise UI and capture genuine local evidence
        run: xvfb-run -a -s "-screen 0 1440x1200x24" python scripts/capture_evidence.py
      - name: Upload actual local screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealership-local-evidence
          path: |
            screenshots/local/
            evidence/django-server.log
          if-no-files-found: warn
      - name: Stop temporary CI services
        if: always()
        run: docker compose down --volumes

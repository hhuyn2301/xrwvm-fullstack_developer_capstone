name: Deploy capstone to Kubernetes
on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Existing Kubernetes namespace
        required: true
        type: string
      web_image:
        description: Full web image reference from a successful publish
        required: true
        type: string
      backend_image:
        description: Full Express API image reference
        required: true
        type: string
      sentiment_image:
        description: Full sentiment image reference
        required: true
        type: string
      public_origin:
        description: Exact application origin, for example https://your-real-lab-host
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: capstone
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Load authorized cluster credentials
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          test -n "$KUBECONFIG_BASE64"
          umask 077
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Apply application and wait for real rollout
        env:
          DEPLOY_NAMESPACE: ${{ inputs.namespace }}
          WEB_IMAGE: ${{ inputs.web_image }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          SENTIMENT_IMAGE: ${{ inputs.sentiment_image }}
          PUBLIC_ORIGIN: ${{ inputs.public_origin }}
        run: bash deploy/apply_kubernetes.sh
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kube/config"

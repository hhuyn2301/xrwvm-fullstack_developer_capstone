services:
  mongo_db:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3030:3030"
    environment:
      MONGODB_URI: mongodb://mongo_db:27017/dealershipsDB
      PORT: "3030"
    depends_on:
      mongo_db:
        condition: service_healthy

volumes:
  mongo_data:
